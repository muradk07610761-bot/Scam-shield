name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create myapp
      - run: |
          cat > myapp/lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false, home: Home()));
          class Home extends StatefulWidget{ @override State<Home> createState()=>_H();}
          class _H extends State<Home>{
            int t=0; var a=TextEditingController(); var b=TextEditingController(); var c=TextEditingController(); String r="Result"; Color co=Colors.blue;
            void f1(){var s=a.text; setState((){if(s.length<10){r="10 digit likho"; co=Colors.orange;} else if(s.startsWith("140")){r="SCAM HAI"; co=Colors.red;} else {r="SAFE hai"; co=Colors.green;}});}
            void f2(){var s=b.text.toLowerCase(); setState((){if(s.contains("bit.ly")||s.contains("free")||s.contains("kyc")){r="FAKE LINK"; co=Colors.red;} else {r="Link Safe"; co=Colors.green;}});}
            void f3(){var s=c.text; setState((){if(s.length>15){r="UPI FRAUD"; co=Colors.red;} else {r="UPI OK"; co=Colors.green;}});}
            @override Widget build(BuildContext context){
              var p1=ListView(padding:EdgeInsets.all(16),children:[Icon(Icons.shield,size:80,color:Colors.blue),TextField(controller:a,decoration:InputDecoration(labelText:"Phone Number",border:OutlineInputBorder())),ElevatedButton(onPressed:f1,child:Text("CHECK")),Container(padding:EdgeInsets.all(12),color:co.withOpacity(0.2),child:Text(r,style:TextStyle(color:co,fontWeight:FontWeight.bold)))]);
              var p2=ListView(padding:EdgeInsets.all(16),children:[Text("11 Features",style:TextStyle(fontSize:22,fontWeight:FontWeight.bold)),TextField(controller:b,decoration:InputDecoration(labelText:"1. Link Scanner",border:OutlineInputBorder())),ElevatedButton(onPressed:f2,child:Text("Scan Link")),TextField(controller:c,decoration:InputDecoration(labelText:"2. UPI Checker",border:OutlineInputBorder())),ElevatedButton(onPressed:f3,child:Text("Check UPI")),ListTile(title:Text("3. Job Scam")),ListTile(title:Text("4. Loan Scam")),ListTile(title:Text("5. Lottery Scam")),ListTile(title:Text("6. KYC Scam")),ListTile(title:Text("7. OTP Fraud")),ListTile(title:Text("8. WhatsApp Scam")),ListTile(title:Text("9. OLX Scam")),ListTile(title:Text("10. Blacklist")),ListTile(title:Text("11. Auto Alert")),Text(r,style:TextStyle(color:co,fontWeight:FontWeight.bold))]);
              return Scaffold(appBar:AppBar(title:Text("Scam Shield")),body:t==0?p1:p2,bottomNavigationBar:BottomNavigationBar(currentIndex:t,onTap:(i){setState(()=>t=i);},items:[BottomNavigationBarItem(icon:Icon(Icons.phone),label:"Number"),BottomNavigationBarItem(icon:Icon(Icons.list),label:"11 Features")]));
            }
          }
          ENDDART
      - run: cd myapp && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scam-shield-apk
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
