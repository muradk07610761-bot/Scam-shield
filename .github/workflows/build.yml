name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          flutter create myapp
          cat > myapp/lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(ScamShieldApp());
          class ScamShieldApp extends StatelessWidget {
            @override Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: HomePage());
            }
          }
          class HomePage extends StatefulWidget { @override _HomePageState createState() => _HomePageState(); }
          class _HomePageState extends State<HomePage> {
            TextEditingController _c = TextEditingController();
            String res = "Number daal ke check karo"; Color col = Colors.grey;
            void check(){
              String n=_c.text;
              if(n.length<10){setState((){res="Sahi number daalo"; col=Colors.orange;}); return;}
              if(n.endsWith("0")||n.endsWith("1")){setState((){res="SCAM HO SAKTA HAI!"; col=Colors.red;});}
              else{setState((){res="Safe Hai"; col=Colors.green;});}
            }
            @override Widget build(BuildContext context){
              return Scaffold(appBar: AppBar(title: Text("Scam Shield")), body: Padding(padding: EdgeInsets.all(20), child: Column(children: [Icon(Icons.security,size:80,color:Colors.blue),SizedBox(height:20),TextField(controller:_c, decoration: InputDecoration(labelText:"Phone Number",border:OutlineInputBorder())),SizedBox(height:20),ElevatedButton(onPressed:check, child: Text("CHECK KARO")),SizedBox(height:20),Container(padding:EdgeInsets.all(20), decoration: BoxDecoration(color:col.withOpacity(0.2), borderRadius: BorderRadius.circular(10), border: Border.all(color:col)), child: Text(res, style: TextStyle(fontSize:20, color:col)))])));
            }
          }
          EOF
      - run: cd myapp && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scam-shield-apk
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
